# Local services. Start with: docker compose up -d
services:
  mailpit:
    # Catches every outgoing email; nothing reaches real inboxes.
    image: axllent/mailpit:v1.27
    container_name: gst-itc-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (EMAIL_TRANSPORT=smtp, SMTP_HOST=localhost, SMTP_PORT=1025)
      - "8025:8025" # Web inbox: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
